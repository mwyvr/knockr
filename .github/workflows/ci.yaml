name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.3.0
      - name: race tests
        run: go test -race ./...
      - name: manpage current
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq scdoc
          make man
          git diff --exit-code -I 'Generated by scdoc' knockr.1
